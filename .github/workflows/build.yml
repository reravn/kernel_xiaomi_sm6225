name: build kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/reravn/kernel_xiaomi_sm6225
          kernel-branch: ye
          config: fog-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: false
          ksu: false
          ksu-version: v3.0.0-122
          ksu-lkm: false
          ksu-other: true
          ksu-url: https://github.com/backslashxx/KernelSU
          bbg: true
          other-clang-url: https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz
          disable-lto: true
          anykernel3: true
          anykernel3-url: https://github.com/alternoegraha/AnyKernel3-680
